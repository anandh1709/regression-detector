name: Prompt Regression Eval

on:
  pull_request:
    paths:
      - 'prompts/**'

jobs:
  run-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run regression eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python eval_runner.py

      - name: Commit updated run history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/run_history/run_history.json
          git commit -m "Update run history [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref }}

    